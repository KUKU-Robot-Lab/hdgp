# OpenArm + RH56F1 bimanual pose params (_rl 소스 단일 기준)
# (arm 7 + hand drive 6) x 2 = 26 DOF total
# cspace 순서 = [r_arm7, r_hand6, l_arm7, l_hand6]
# Based on openarm_tesollo_pose_params.yaml (게인 동일, 충돌/한계 26 DOF 로 확장)

fabric_params:
    cspace_attractor:
        min_isotropic_mass: 1.
        max_isotropic_mass: 1.
        mass_sharpness: 20.0
        mass_switch_offset: 1.
        conical_sharpness: 20.
        conical_gain: 1.
    joint_limit_repulsion:
        velocity_gate: True
        breakaway_distance: 0.0
        breakaway_velocity: 0.
        soft_relu_gain: 8.
        metric_scalar: 0.02
        metric_exploder_offset: 0.1
        max_metric: 100.
        damping_gain: 8.
    hand_attractor:
        min_isotropic_mass: 8.
        max_isotropic_mass: 8.
        mass_sharpness: 20.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 10.
        damping_radius: 0.2
    palm_attractor:
        min_isotropic_mass: 1.
        max_isotropic_mass: 1.
        mass_sharpness: 10.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 80.
        damping: 50.
        damping_sharpness: 10.
        damping_radius: .2
    body_repulsion:
      max_depth: 2.
      min_depth: 0.01
      engage_depth: 0.30
      breakaway_depth: 0.0
      breakaway_velocity: 0.
      metric_scalar: 1.
      velocity_gate: True
      velocity_gate_sharpness: 1000.
      velocity_gate_offset: 0.002
      rescaled_min_dist: .01
      forcing_metric_scalar: .01
      geom_metric_scalar: .01
      constant_accel: 2.
      constant_accel_geom: 3.0
      damping_gain: 0.
      # 충돌구는 _rl URDF 실존 프레임만 사용(구 Tesollo/world_body 프레임 제거).
      # 팔은 링크 원점(r_al_*/l_al_*), 손은 손가락 proximal 구(r_sphere_*/l_sphere_*),
      # 손바닥은 r_hl_palm_sensor/l_hl_palm_sensor, 몸통은 root(body_link) 1구로 근사.
      # (구 팔 세부구 _sphere2/3 는 새 URDF 에 없음 → 제외, 충돌 거칠어짐. 필요시
      #  generate 스크립트에 팔 오프셋 구 추가로 정밀화.)  frames/radii 길이 정합(19).
      collision_sphere_frames:
          ["r_al_2", "r_al_4", "r_al_7",
           "r_hl_palm_sensor",
           "r_sphere_thumb", "r_sphere_index", "r_sphere_middle", "r_sphere_ring", "r_sphere_pinky",
           "l_al_2", "l_al_4", "l_al_7",
           "l_hl_palm_sensor",
           "l_sphere_thumb", "l_sphere_index", "l_sphere_middle", "l_sphere_ring", "l_sphere_pinky",
           "body_link"]
      collision_sphere_radii: [0.12, 0.125, 0.075,
                               0.05,
                               0.025, 0.022, 0.022, 0.022, 0.022,
                               0.12, 0.125, 0.075,
                               0.05,
                               0.025, 0.022, 0.022, 0.022, 0.022,
                               0.15]
      collision_sphere_pairs: []
      collision_link_prefix_pairs: [
                                    # 오른손 손가락/palm vs 오른팔 상완/전완 (손목 r_al_7 은 인접 → 제외)
                                    ["r_sphere", "r_al_2"], ["r_sphere", "r_al_4"],
                                    ["r_hl_palm_sensor", "r_al_2"], ["r_hl_palm_sensor", "r_al_4"],
                                    # 오른손/오른팔 vs 몸통
                                    ["r_sphere", "body_link"],
                                    ["r_hl_palm_sensor", "body_link"],
                                    ["r_al", "body_link"],
                                    # 왼손 손가락/palm vs 왼팔 (미러)
                                    ["l_sphere", "l_al_2"], ["l_sphere", "l_al_4"],
                                    ["l_hl_palm_sensor", "l_al_2"], ["l_hl_palm_sensor", "l_al_4"],
                                    ["l_sphere", "body_link"],
                                    ["l_hl_palm_sensor", "body_link"],
                                    ["l_al", "body_link"],
                                    # 교차팔: 오른손 클러스터 vs 왼팔 (최소)
                                    ["r_sphere", "l_al"],
                                    ["r_hl_palm_sensor", "l_al"]]
    cspace_damping:
      gain: 10.
    speed_control:
      active: False
      energy_target: 10.
      damping: 100.
    joint_limits:
      active: True
      # 26 DOF: [r_arm7, r_hand6, l_arm7, l_hand6]
      #   arm7=(aj_1~7), hand6=(thumb_1, thumb_2, index_1, middle_1, ring_1, pinky_1)
      acceleration: [7.5, 7.5, 10., 10., 10., 20., 20.,
                     22.5, 22.5, 22.5, 22.5, 22.5, 22.5,
                     7.5, 7.5, 10., 10., 10., 20., 20.,
                     22.5, 22.5, 22.5, 22.5, 22.5, 22.5]
      jerk: [3750., 3750., 5000., 5000., 5000., 10000., 10000.,
             2250., 2250., 2250., 2250., 2250., 2250.,
             3750., 3750., 5000., 5000., 5000., 10000., 10000.,
             2250., 2250., 2250., 2250., 2250., 2250.]
