# grasp_v2 distillation student — RealSense D435i mono RGB (+ object_pos aux)
#
# obs: student 205D (물체 privileged state 없음) + rgb/depth 320x180
# 입력 modality = RGB(use_depth=False, env.img_aug_type="rgb" 와 일치, rh56f1 정합).
# 학습은 PPO 가 아니라 DAgger(openarm/distillation/dagger.py) — 아래 config 의
# ppo/lr/kl 계열 값은 rl_games ModelBuilder 가 요구해서 남긴 것이고 실제 최적화는
# Dagger 가 자체 Adam(1e-4)으로 돌린다. Dagger 가 실제로 읽는 값:
#   horizon_length, seq_length, normalize_input, normalize_value
#
# aux head: teacher 가 관측하던 object_pos 를 이미지에서 회귀시켜, 인코더가
# "물체가 어디 있나"를 명시적으로 학습하게 만든다 (aux_coeff=1.0).

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: a2c_mono_transformer
    separate: False
    # [07-22 rh56f1 정합] RGB 입력(3ch, resnet pretrained 정합). env.img_aug_type="rgb"
    # 와 반드시 일치. 종전 use_depth=True 는 env img_aug_type="rgb" 와 모순이라 dagger
    # modality 가드(dagger.py)에서 걸렸다 — rh56f1 처럼 RGB 로 통일한다(실물 D435i RGB
    # 정합 + visual DR 로 sim2real). depth 는 obs 에 함께 렌더돼 향후 depth 재구성 aux 재료.
    use_depth: False
    # CNN 인코더를 처음부터 학습(False, rh56f1 정합). True(동결)면 랜덤 초기화 인코더가
    # 물체를 못 봐 파지 실패(in_success 0.0 — dt1·07-23 tesollo freeze=True 실측 일치).
    # True 는 인코더가 이미 학습된 뒤 LSTM 윈도우만 격리하는 후기 단계용. seq_length=1 과
    # 세트여야 함: seq_length=16(BPTT retain)+freeze=False 는 LSTM(512)+layer_norm inplace
    # 충돌로 backward 크래시("version 17 expected 16"). tesollo occlusion 낮음(가시율 0.99,
    # 07-22 probe) 확인돼 per-frame(seq_length=1) 로 충분 → rh56f1 과 동일 설정.
    freeze_img_features: False
    # 카메라 해상도(D435i 16:9). a2c_mono_transformer RunningMeanStd/encoder 형상과 일치 필수.
    img_height: 180
    img_width: 320

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [512, 512, 256]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True
      layer_norm: True

    aux_network:
      mlp:
        units: [512, 256]
        activation: elu
        out_activation: None
        d2rl: False
        initializer:
          name: default
        regularizer:
          name: None

    aux_outputs:
      object_pos: {size: 3}

  load_checkpoint: False
  load_path: ''

  config:
    name: 5g_grasp_right-v2-student
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    # BPTT 윈도우. tesollo occlusion 낮아(가시율 0.99, 07-22 probe) per-frame(1, rh56f1 정합).
    # [07-23] seq16 마지막 시도 결과 비viable 확정: freeze=False+seq16 은 (1)resnet BN inplace
    # 크래시(BN fix 로 해소했으나) (2)num_envs256 OOM→128 로도 GPU 42→62GB 증가 (3)in_success
    # iter620 까지 0.0(seq1 은 동시점 0.05) + imit_loss 96~441 불안정. 병목=실행격차지 시간메모리
    # 아니라 seq16 무효. seq1 로 복귀(가벼움·rh56f1 정합). vision 정책 개선은 실행격차 직공으로.
    seq_length: 1
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
