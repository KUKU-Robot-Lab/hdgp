# 5g_pour_right_v6 — LSTM PPO + step BC + Chunk BC 설정
# algo: pour_chunk_bc (PourChunkBCAgent)
# 관측: actor 60D / critic 143D (asymmetric), 액션: 11D
#
# Chunk BC:
#   obs[t] → MLP(256) → LSTM(512) → chunk_head → action_chunk(11×32)
#   chunk_head는 별도 optimizer (학습률 1e-4)
#   step BC는 epoch 1000까지 단계적 종료, chunk BC가 주 BC

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: pour_chunk_bc

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: False   # obs → MLP(256) → LSTM(512)
      layer_norm: True
      concat_input: False
      concat_output: False

  load_checkpoint: False
  load_path: ''

  config:
    name: 5g_pour_right-v6
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 2e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 500
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0015
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    seq_length: 32
    zero_rnn_on_done: True
    minibatch_size: 8192
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic은 143D privileged obs 사용
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 8192
      mini_epochs: 4
      learning_rate: 5e-5
      lr_schedule: linear
      kl_threshold: 0.016
      clip_value: True
      e_clip: 0.2
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    # ── step BC (SuccessTrajBuffer) — epoch 1000까지 단계적 종료 ──────────
    bc_loss_warmup_epochs: 200
    bc_loss_decay_epochs: 800
    bc_loss_weight_init: 0.5
    bc_loss_weight_final: 0.0
    bc_min_buffer_size: 5
    bc_seq_len: 8
    bc_batch_size: 64

    # ── 실제 HDF5 데모 step BC (DemoBCBuffer) — epoch 1000까지 종료 ──────
    real_demo_bc_enable: True
    real_demo_bc_warmup_epochs: 0
    real_demo_bc_decay_epochs: 1000
    real_demo_bc_weight_init: 10.0
    real_demo_bc_weight_final: 0.0
    real_demo_bc_min_buffer_size: 1
    real_demo_stride: 2
    real_demo_bc_start_mode: warm_state_match
    real_demo_bc_start_fraction: 0.0
    real_demo_bc_warm_state_paths:
      - /home/user/rl_ws/datasets/grasp_warm_v7_2_contact4_balanced_400x10.hdf5
    real_demo_pour_sample_ratio: 0.0

    # ── Chunk BC (PourChunkBCAgent) — 주 BC ────────────────────────────
    chunk_size: 32                  # H: 32 step = 0.53s @ 60Hz
    chunk_bc_lr: 1.0e-4
    chunk_bc_warmup_epochs: 0
    chunk_bc_decay_epochs: 5000
    chunk_bc_weight_init: 10.0
    chunk_bc_weight_final: 1.0
    chunk_bc_batch_size: 64
