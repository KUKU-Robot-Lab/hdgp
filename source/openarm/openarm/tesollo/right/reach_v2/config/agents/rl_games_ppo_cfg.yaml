# 5g_grasp_right_v1-2 rl_games PPO 설정
# v7: Fabrics 팔 학습(6D palm) + per-finger lerp(5D) + sim2real 가능 obs
# 관측: actor 106D / critic 143D (asymmetric), 액션: 11D
# Asymmetric Actor-Critic (has_central_value: True), MLP [512, 256, 128]

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: '/home/user/rl_ws/hdgp/log/rl_games/pipeline/right/5g_grasp_right_v1/test2/nn/5g_grasp_right-v1.pth'

  config:
    name: 5g_reach_right-v2
    full_experiment_name: test1
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 1000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 64
    # minibatch_size: num_envs × horizon_length 이 반드시 나누어 떨어져야 함
    #   [RTX 3090 정규학습 최적] 1024 envs: batch= 65536 → minibatch=16384 (4 splits)
    #   [RTX 3090 가벼운학습]    512 envs: batch= 32768 → minibatch= 8192 (4 splits)
    #   [서버/4090 대형학습]     2048 envs: batch=131072 → minibatch=32768 (4 splits)
    minibatch_size: 16384     # RTX 3090 전용 최적화 (--num_envs 1024 기준)
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic은 143D privileged obs 사용
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 16384     # RTX 3090: actor와 동일하게 16384 맞춤
      mini_epochs: 4
      learning_rate: 3e-4
      lr_schedule: linear
      kl_threshold: 0.013
      clip_value: True
      e_clip: 0.2
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
