# gripper/left/grasp_sensor (fab) — **MLP 대조군**. kuka 설정에서 **RNN 만** 뺐다.
#
# 왜: t30 이 ep464 까지 `lifting_object` 정확히 0 이고 best 보상이 ep100 이후 갱신되지
#   않았다. t16(역대 최고)과 갈린 축이 여럿인데, 그 중 가장 큰 것이 **학습기**다 —
#   t16 은 MLP[256,128,64]·대칭 critic 이었고 t30 은 LSTM 1024 + central value LSTM 2048 이다.
#   이 저장소에 "LSTM 은 ep3000~4000 후 상승 시작이 정상"이라는 관찰이 이미 있다(grasp-v2).
#   ⚠ 다만 그건 **다른 태스크의 관찰**이고, 이 런의 정체가 그 때문이라는 것은 아직
#     **가설**이다. reach 가 평탄·감소이고 best 가 ep100 에 멈춘 것은 "느린 시작"의
#     전형적 서명은 아니다. 그래서 단일 변수로 가른다.
#
# 이 파일은 원본에서 `rnn:` 블록 둘(actor·central value)만 제거한 것이다.
# 나머지(감마 0.998 · lr 3e-4 linear · horizon 16 · minibatch 16384 · mini_epochs 4 ·
# bounds_loss_coef 0.005 · 비대칭 critic · clip 5.0/1.0)는 **전부 kuka 그대로**다.
# 사용자 판단: "다른 값들은 KUKA 버전이 옳다".
#
# 원본(LSTM 판): rl_games_ppo_fab_cfg.yaml
#
# 사용자 지시: "REWARD 구성 외에는 모든 세팅을 KUKA로 맞춤".
# 원본: dextrah_lab/tasks/dextrah_kuka_allegro/agents/rl_games_ppo_lstm_cfg.yaml
#
# 구 설정은 IsaacLab `Isaac-Lift-Cube-OpenArm-v0` 사본(MLP [256,128,64] · 대칭 critic ·
# gamma 0.99 · lr 1e-4 adaptive)이었다. 원본과 다음이 갈렸다:
#   · actor LSTM 1024 부재 · **central value(critic LSTM 2048) 부재**
#   · gamma 0.998→0.99 · lr 3e-4 linear→1e-4 adaptive · horizon 16→24 · mini_epochs 4→8
#   · bounds_loss_coef 0.005→0.001 · bound_loss_type regularization 미지정
#   · clip_observations 5.0→100.0 · clip_actions 1.0→100.0
# ⚠ LSTM·비대칭 critic 도입으로 체크포인트 모양이 바뀐다 — **fresh 학습 전용**.
# ⚠ max_epochs 만 원본(20000)과 다르게 둔다. 이유는 config 주석 참조.

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: False
  load_path: ''

  config:
    name: open-grip_l_grasp_sensor_fab_mlp
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000
    # ⚠ 원본은 20000 이다. 우리는 GPU 한 대에 1024 env 라 원본(대규모 분산)과 처리량이
    #   다르고, 이 트랙의 붕괴 패턴(정점 후 σ 재팽창)을 정점 근처에서 끊어야 한다.
    #   ★원본값이 아닌 유일한 하이퍼파라미터다.
    max_epochs: 4000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 16
    bound_loss_type: regularization
    bounds_loss_coef: 0.005
    zero_rnn_on_done: True

    central_value_config:
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 5e-5
      kl_threshold: 0.016
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
    player:
      deterministic: True
      games_num: 100000
      print_stats: True
