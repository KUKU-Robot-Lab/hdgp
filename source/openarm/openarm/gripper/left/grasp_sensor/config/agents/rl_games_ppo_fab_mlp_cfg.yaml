# gripper/left/grasp_sensor (fab) — **MLP 판** (fab_test44, 사용자 결정).
#
# ★★fab_test43 이 가른 것: 학습기가 최적화하는 목표가 보상이 아니라 **critic 편향**이었다.
#     shaped = 0.01×보상 + γ·V(s_끝)·절단
#   에피소드 300스텝의 과제 신호(0.04~0.06)보다 절단 한 스텝의 γ·V(0.10~0.22)가 2~6배
#   컸고, 그 V 는 관측 리턴(−0.017)과 부호가 반대(+0.20)였다. `normalize_advantage` 라
#   순위만 남는데 그 순위를 critic 의견이 결정 → 정책이 critic 지형을 올랐다. 실측:
#   shaped −0.21→+0.21 상승하는 동안 raw −2.5→−5.0 하락, 벌점상 2.2배 좋은 상태를
#   버리고 박스 구석으로 이동. **학습은 됐다 — 목표가 틀렸다.**
#
# 수정 두 가지(같은 가설의 두 팔):
#   ① `scale_value` 0.01 → **1.0** — 과제 신호를 critic 초기 편향(O(0.1~1))보다 크게.
#   ② RNN 제거 — V 가 그렇게 틀린 이유가 **LSTM 2048 critic** 이었다(스텝당 2e-4 짜리
#     신호를 맞추다 c_loss 0.005 로 조기 확신). 이 태스크는 완전 관측이라 기억이 필요
#     없고, 이 트랙 역대 최고(t16)도 MLP 였다.
#
# 사용자 결정(fab_test44): "CRITIC 은 MLP · ACTOR 는 DexPour 와 같게"
#   actor  = DexPour Table I 그대로: FC **512·512·256·128** ELU, RNN 없음
#   critic = central value MLP [1024, 512] (kuka 비대칭 critic 구조 유지, LSTM 만 제거)
#
# 학습기 수정 이력은 전부 LSTM 판(rl_games_ppo_fab_cfg.yaml)에서 가져왔다:
#   value_bootstrap True(t31) · gamma 0.99(t31) · lr adaptive(t36) ·
#   bound_loss_type bound(t36 — 'regularization' 은 rl_games 의 죽은 분기다)
# ⚠ 구판 이 파일은 t36/t31 **이전**에 만든 것이라 그 버그 4개가 살아 있었다. 재작성함.
# ⚠ DexPour Table I 의 나머지(entropy 0.005 · lr 5e-4 · minibatch 4개)는 **아직 이식
#   안 함** — 이번 판의 변수는 아키텍처와 scale_value 뿐이다(한 번에 한 가설).

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    # ★DexPour Table I: FC 512·512·256·128 · ELU · RNN 없음
    mlp:
      units: [512, 512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: open-grip_l_grasp_sensor_fab_mlp
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True   # ★t31 — 절단(γ·V) 보정. 실패 3종이 truncated 라 필수
    num_actors: -1
    reward_shaper:
      # ★★fab_test44 핵심 수정. 0.01 은 과제 신호를 critic 초기 편향의 1/100 로 눌러
      #   순위 결정권을 critic 에 넘겼다(t42 실측 2.8~8.4배, t43 실측 1.7~5.6배 지배).
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99             # ★t31 — 0.998 은 300스텝 절단 왜곡을 3.7배로 키운다
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive   # ★t36 — linear 는 a_loss 를 42배 죽였다
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000
    max_epochs: 4000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    # ★fab_test47(사용자 결정 C): 0.002 → 0.005 (DexPour Table I).
    #   벌점 체계에서 탐색 노이즈는 순비용이라 σ 를 줄이는 것이 가장 싼 개선이 된다 —
    #   t44~t46 이 σ 0.29/0.256/0.213 으로 3연속 조기 붕괴했다(엔트로피가 음수 =
    #   σ < 1/√(2πe) = 0.242). 0.002 는 양수 보상 체계용 값이었다.
    entropy_coef: 0.005
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    bound_loss_type: bound  # ★t36 — 'regularization' 은 어느 분기와도 안 맞아 통째로 0
    bounds_loss_coef: 0.005

    central_value_config:
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 5e-5
      kl_threshold: 0.016
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True
        # ★사용자 결정: critic 은 MLP. LSTM 2048 이 t43 의 틀린 V(+0.20 vs 정답 −0.017)
        #   의 진원지였다.
        mlp:
          units: [1024, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
