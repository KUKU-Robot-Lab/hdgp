# grasp_lift_fabric — rl_games PPO, **DEXTRAH 논문 E.6 구성**.
#
# ★★rl_games_ppo_cfg.yaml 과의 유일한 차이: **critic 에서 LSTM 을 뺐다**.
#
# 논문 E.6 Teacher Architecture 원문:
#   "크리틱은 모든 특권 정보에 접근할 수 있으므로 **시간적 의존성을 포착할 필요가 없으며**,
#    이에 따라 MLP 네트워크를 사용한다. teacher 정책은 관측의 시간적 의존성을 포착하기
#    위해 MLP 층 뒤에 LSTM 층을 사용한다. 다만 LSTM 은 학습 안정성이 낮은 경향이 있으므로
#    LSTM 을 우회하는 **스킵 연결**을 추가하였다."
#
# ★원본 레포(2025-06-03)의 `rl_games_ppo_lstm_cfg.yaml` 은 논문과 달리 critic 에도
#   LSTM 2048 을 둔다. 논문 이후 코드가 바뀐 것으로 보이며, 어느 쪽이 나은지는
#   실험 문제다 — 그래서 **둘 다 돌릴 수 있게** 별도 파일로 둔다.
#     기본 태스크         → rl_games_ppo_cfg.yaml        (critic LSTM 2048, 레포 구성)
#     `-paper` suffix     → 이 파일                       (critic MLP, 논문 구성)
#
# ★우리 쪽 근거 보강: 우리 critic 은 물체 회전·접촉력·물체 6D 속도·fabric 속도/가속까지
#   보고(204D), actor 도 속도를 살렸다(원본은 annealing 계수로 죽인다). 즉 관측이 원본보다
#   Markov 에 가까워 critic 의 시간 의존성 근거가 더 약하다.
#
# ★actor 의 `before_mlp: True`(LSTM → MLP)는 **레포 그대로 둔다**. 논문 서술은
#   "MLP 뒤에 LSTM" 이라 반대지만 그림 참조로만 기술돼 있고, 한 번에 하나씩 바꿔야
#   원인이 분리된다.

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512]          # KUKA 고정
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    # ★★KUKA 고정(08.25). 원본 teacher 는 actor LSTM 1024(before_mlp) + critic LSTM 2048.
    #   구 주석("obs 가 거의 Markov 라 LSTM 비용을 정당화할 근거가 없다")은 접촉 이력을
    #   빼고 본 판단이었다 — 파지는 "지금 닿았나"가 아니라 "닿은 채로 유지했나"이고,
    #   그건 순간 관측으로 안 보인다. horizon_length/minibatch/seq_length 가 함께 따라온다.
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: True
      layer_norm: True
      concat_input: True
      concat_output: True

  load_checkpoint: False
  load_path: ''   # 체크포인트는 --checkpoint 로 준다(남의 경로 잔재 제거)

  config:
    name: agn_grasp_lift_fab_paper
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False       # KUKA 고정
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000       # KUKA 고정
    max_epochs: 20000            # KUKA 고정
    save_best_after: 100
    save_frequency: 200          # KUKA 고정
    print_stats: True
    grad_norm: 1.0
    # ★08.21 fab_test8 실측으로 0.002 → 0.0005. 0.002 는 이 저장소 MLP 최고값이었고,
    #   ep2100 이후 정책 sigma 가 0.76 → 1.30 으로 팽창해 총보상이 3017 → 2045 로 퇴행했다.
    #   액션이 **절대 목표값**이라 sigma>1 이면 샘플이 대부분 박스 경계로 클립돼 평균이 묻힌다.
    #   pour 계열 주석이 같은 실패("0.0008 이 과함 → entropy 상승")를 이미 기록해 뒀다.
    entropy_coef: 0.002          # KUKA 고정(LSTM 전제)
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16           # KUKA 고정(seq_length 16 과 짝)
    # minibatch_size: num_envs × horizon_length 이 반드시 나누어 떨어져야 함
    #   128  envs: batch=   8192 → minibatch= 2048 (4 splits)
    #   2048 envs: batch= 131072 → minibatch=32768 (4 splits)  ← 학습 권장
    minibatch_size: 16384     # KUKA 고정. --num_envs 2048 기준
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    # ★rl_games 는 영국식 'regularisation' 으로 비교한다. 'regularization' 이면 두 분기 모두
    #   안 걸려 b_loss = zeros — bounds 정규화가 조용히 꺼진다(fab_test8 4110 스텝 전부 정확히 0.0).
    #   'regularisation'(mu² 전체 벌점)은 a=0 이 홈이라 홈 고착 압력이 되므로 쓰지 않는다.
    #   'bound' 는 |mu|>1.1 에서만 켜지는 가드레일이라 정상 구간에서 무해하다.
    seq_length: 16               # KUKA 고정(LSTM BPTT 창)
    zero_rnn_on_done: True       # KUKA 고정 — 에피소드 경계에서 은닉상태 리셋
    bound_loss_type: bound
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic은 143D privileged obs 사용
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 16384     # KUKA 고정(actor와 동일)
      mini_epochs: 4
      learning_rate: 5e-5       # KUKA 고정
      lr_schedule: adaptive
      kl_threshold: 0.016       # KUKA 고정
      clip_value: True
      e_clip: 0.2
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 512]     # KUKA 고정
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
