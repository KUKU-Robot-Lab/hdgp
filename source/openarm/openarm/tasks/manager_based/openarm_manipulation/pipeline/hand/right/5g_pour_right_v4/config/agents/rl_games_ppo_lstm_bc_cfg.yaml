# 5g_pour_right_v4 — LSTM + BC Aux Loss 설정
# PourLstmBCAgent (a2c_continuous_lstm_bc) 전용
# 관측: actor 106D / critic 143D, 액션: 11D
# Asymmetric Actor-Critic + LSTM policy

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous_lstm_bc  # PourLstmBCAgent 등록 이름

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    # LSTM: MLP 이전에 시계열 컨텍스트 인코딩
    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: True    # LSTM → MLP 순서 (시계열 → 결정)
      concat_input: True  # obs 와 LSTM output 을 MLP 입력에 concat
      layer_norm: True
    mlp:
      units: [256, 128]   # LSTM 포함으로 파라미터 증가 — MLP는 간소화
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: 5g_pour_right-v4-lstm-bc
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0008
    truncate_grads: True
    e_clip: 0.25
    horizon_length: 64
    # LSTM: seq_length = BPTT truncation 길이 (horizon_length 의 약수여야 함)
    seq_length: 16
    minibatch_size: 32768
    mini_epochs: 6
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic 은 143D privileged obs
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 32768
      mini_epochs: 6
      learning_rate: 1e-4
      lr_schedule: linear
      kl_threshold: 0.013
      clip_value: True
      e_clip: 0.25
      network:
        name: actor_critic
        central_value: True
        rnn:
          name: lstm
          units: 256
          layers: 1
          before_mlp: True
          concat_input: True
          layer_norm: True
        mlp:
          units: [256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
