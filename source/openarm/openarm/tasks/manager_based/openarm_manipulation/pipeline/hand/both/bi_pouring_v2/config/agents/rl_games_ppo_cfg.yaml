# bi_pouring_v2 rl_games PPO config
# DirectRLEnv 기반 (incremental joint position control)
#   - right-arm-only policy (7D incremental velocity-like actions)
#   - fixed left holder / fixed right hand (write_joint_state_to_sim)
#   - single-bead transfer shaping
# Actor obs: 40D / actions: 7D
# Default train envs: 2048

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""

  config:
    name: bi_pouring_v2
    env_name: rlgpu
    device: "cuda:0"
    device_name: "cuda:0"
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 20000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    # batch_size = num_envs * horizon_length 의 약수여야 함.
    # num_envs=2048: batch=32768 → 32768/16384=2 mini-batches
    # num_envs=128:  batch=2048  → 2048/1024=2 mini-batches  (동일 비율)
    minibatch_size: 1024
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005
    has_central_value: False
