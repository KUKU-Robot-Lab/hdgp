# bi_pouring_v1 rl_games PPO config
# v1 scope:
#   - right-arm-only policy
#   - fixed left holder (non-policy-controlled)
#   - no finger action / no finger observation
#   - single-bead transfer shaping
# Actor obs: 36D / critic obs: 48D / actions: 7D
# Default train envs: 2048
# Asymmetric Actor-Critic (has_central_value: True), MLP [512, 256, 128]

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""

  config:
    name: bi_pouring_v1
    env_name: rlgpu
    device: "cuda:0"
    device_name: "cuda:0"
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 20000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 3e-4
      lr_schedule: linear
      kl_threshold: 0.013
      clip_value: True
      e_clip: 0.2
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
