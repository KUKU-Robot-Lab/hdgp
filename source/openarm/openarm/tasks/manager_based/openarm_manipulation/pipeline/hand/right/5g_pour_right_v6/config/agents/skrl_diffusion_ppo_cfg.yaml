# Phase 2 RL fine-tune: Diffusion BC prior + skrl PPO + asymmetric A2C
#
# 전제:
#   - Phase 1 (train_bc.py --epochs 5000) 완료 후 bc_5000.pt 생성됨
#   - pour_right_env_cfg.py: enable_left_arm_domain_random=True
#   - NUM_OBSERVATIONS=52 (DiffusionActor 52D obs)
#   - NUM_CRITIC_OBSERVATIONS=143 (AsymmetricCritic, 변경 없음)
#
# 실행:
#   python3 /home/user/rl_ws/hdgp/scripts/reinforcement_learning/skrl/train.py \
#     --task 5g_pour_right-v6-diffusion \
#     --agent skrl_diffusion_ppo_cfg_entry_point \
#     --num_envs 128

seed: 42


# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  separate: True  # 비대칭 A2C: actor (policy) obs != critic (value) obs

  policy:
    class: openarm.tasks.manager_based.openarm_manipulation.pipeline.hand.right.5g_pour_right_v6.diffusion_actor_skrl:DiffusionActor
    # BC checkpoint 경로 (Phase 1 완료 후 생성)
    bc_checkpoint_path: ""  # 비워두면 hdgp/log/diffusion_bc/v6/bc_5000.pt 자동 탐색
    n_ddim_steps: 5
    freeze_bc: false
    min_log_std: -4.0
    max_log_std: 0.0

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [1024, 512, 256]
        activations: elu
    output: ONE


# ---------------------------------------------------------------------------
# Rollout memory
# ---------------------------------------------------------------------------
memory:
  class: RandomMemory
  memory_size: -1  # rollouts × num_envs


# ---------------------------------------------------------------------------
# PPO agent
# ---------------------------------------------------------------------------
agent:
  class: PPO
  rollouts: 16
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.998
  lambda: 0.95
  learning_rate: 2.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.013
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0015
  value_loss_scale: 0.5
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "pipeline_right_5g_pour_right_v6_diffusion"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# ---------------------------------------------------------------------------
# Trainer
# ---------------------------------------------------------------------------
trainer:
  class: SequentialTrainer
  timesteps: 30000000  # ~30M steps (128 envs × 16 rollouts × N iterations)
  environment_info: log
