# IL Phase 1: EEF 궤적 추종 PPO (source cup만, beads/target_cup 없음)
#
# 전제:
#   - a11-a20 demo EEF 궤적으로 grasp→pour 모션 사전학습
#   - 보상: r = -w_pos*||eef - demo_eef[t]|| - w_rot*angle(quat, demo_quat[t])
#   - 손가락: demo replay (RL 학습 제외)
#   - obs: 52D (Phase 2와 동일 layout)
#
# 실행:
#   python3 hdgp/scripts/reinforcement_learning/skrl/train.py \
#     --task 5g_pour_right-v6-il2 \
#     --agent skrl_il2_ppo_cfg_entry_point \
#     --num_envs 512   # 512: ~18GB 예상 (OOM시 256으로 낮출 것)
#                      # 1024: v3 수준이나 24GB 초과 가능성 있음

seed: 42


# ---------------------------------------------------------------------------
# Models (symmetric: actor와 critic 모두 52D obs 사용)
# ---------------------------------------------------------------------------
models:
  separate: False

  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -4.0
    max_log_std: 0.5
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128]
        activations: elu
    output: ACTIONS

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128]
        activations: elu
    output: ONE


# ---------------------------------------------------------------------------
# Rollout memory
# ---------------------------------------------------------------------------
memory:
  class: RandomMemory
  memory_size: -1


# ---------------------------------------------------------------------------
# PPO agent
# ---------------------------------------------------------------------------
agent:
  class: PPO
  rollouts: 16
  learning_epochs: 8
  mini_batches: 8   # 512 envs: 16×512/8=1024 per minibatch (128 envs면 4로 복원)
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.05
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.01
  value_loss_scale: 0.5
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "pipeline_right_5g_pour_right_v6_il2"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# ---------------------------------------------------------------------------
# Trainer
# ---------------------------------------------------------------------------
trainer:
  class: SequentialTrainer
  timesteps: 640000   # v3의 10k epoch × 64 horizon 에 해당하는 physics steps
  environment_info: log
