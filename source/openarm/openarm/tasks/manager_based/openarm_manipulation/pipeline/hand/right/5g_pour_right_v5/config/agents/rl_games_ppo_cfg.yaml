# 5g_pour_right_v5 rl_games LSTM PPO + BC 설정
# 관측: actor 110D / critic 143D (asymmetric), 액션: 11D
# LSTM before_mlp=True, Asymmetric Actor-Critic (has_central_value: True)
# BC: sim success trajectories + real HDF5 demo (DemoBCBuffer)
#
# 구조 설계 근거 (v3 LSTM 구조 채택):
#   - actor LSTM 1024: 1200-step 장기 에피소드에서 phase(이송→기울기→붓기) 기억
#   - critic LSTM 2048 (before_mlp=False): value 추정에서 시간 의존성 보완
#   - mixed_precision=False: LSTM + AMP 수치 불안정 회피
#   - horizon=32, minibatch=16384: BPTT 시계열 포착 + 배치 정합

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous_lstm_bc

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: True    # raw obs → LSTM(상태추정) → MLP(정책사상): 부분관측 task 정석
      layer_norm: True
      concat_input: True
      concat_output: True

  load_checkpoint: False
  load_path: ''

  config:
    name: 5g_pour_right-v5
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False    # LSTM 수치 안정 필수 (AMP 비활성)
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 2e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0015
    truncate_grads: True
    e_clip: 0.2
    # horizon=32: 1200-step 장기 에피소드에서 BPTT가 더 긴 시계열 포착
    # batch = 2048 envs × 32 = 65536 → minibatch 16384 = 4 splits (정합)
    horizon_length: 32
    seq_length: 16            # BPTT truncation 윈도우 (horizon 32 = 2 seq 청크)
    zero_rnn_on_done: True
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic 은 143D privileged obs 사용
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 5e-5
      lr_schedule: linear
      kl_threshold: 0.016
      clip_value: True
      e_clip: 0.2
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
        rnn:
          name: lstm
          units: 2048
          layers: 1
          before_mlp: False   # critic: MLP→LSTM (값 추정 보조)
          layer_norm: True
          concat_input: True
          concat_output: True

    # ── BC 하이퍼파라미터 ─────────────────────────────────────────────
    # sim 성공 궤적 BC (SuccessTrajBuffer)
    bc_loss_warmup_epochs: 500
    bc_loss_decay_epochs: 3000
    bc_loss_weight_init: 1.0
    bc_loss_weight_final: 0.1
    bc_min_buffer_size: 5
    bc_seq_len: 16
    bc_batch_size: 64

    # 실제 HDF5 데모 BC (DemoBCBuffer)
    real_demo_bc_enable: True
    real_demo_bc_warmup_epochs: 50
    real_demo_bc_decay_epochs: 1000
    real_demo_bc_weight_init: 0.1
    real_demo_bc_weight_final: 0.01
    real_demo_bc_min_buffer_size: 1
    real_demo_stride: 2
    real_demo_pour_sample_ratio: 0.6
