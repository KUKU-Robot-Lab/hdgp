# 5g_pour_right_v5 rl_games LSTM PPO + BC 설정
# 관측: actor 110D / critic 143D (asymmetric), 액션: 11D
# LSTM before_mlp=True, Asymmetric Actor-Critic (has_central_value: True)
# BC: sim success trajectories + real HDF5 demo (DemoBCBuffer)

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous_lstm_bc

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ''

  config:
    name: 5g_pour_right-v5
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: linear
    schedule_type: standard
    kl_threshold: 0.013
    score_to_win: 100000000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.005   # [test3] 0.003→0.005: BC에 의한 entropy 단조 붕괴 대응
    truncate_grads: True
    e_clip: 0.25
    horizon_length: 64
    # LSTM: seq_length は horizon_length の約数であること
    # 64 = 4 × 16 → seq_length=16 (BPTT window 약 0.27s @ 60Hz)
    seq_length: 16
    zero_rnn_on_done: True
    minibatch_size: 32768
    mini_epochs: 6
    critic_coef: 4
    clip_value: True
    clip_actions: False
    bound_loss_type: regularization
    bounds_loss_coef: 0.005

    # Asymmetric Actor-Critic: critic 은 143D privileged obs 사용
    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: False
      minibatch_size: 32768
      mini_epochs: 6
      learning_rate: 1e-4
      lr_schedule: linear
      kl_threshold: 0.013
      clip_value: True
      e_clip: 0.25
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    # ── BC 하이퍼파라미터 ─────────────────────────────────────────────
    # sim 성공 궤적 BC (SuccessTrajBuffer)
    bc_loss_warmup_epochs: 500
    bc_loss_decay_epochs: 3000
    bc_loss_weight_init: 1.0
    bc_loss_weight_final: 0.1
    bc_min_buffer_size: 5   # [test3] 20→5: sim BC 조기 활성화
    bc_seq_len: 16
    bc_batch_size: 64

    # 실제 HDF5 데모 BC (DemoBCBuffer)
    real_demo_bc_enable: True
    real_demo_bc_warmup_epochs: 50
    real_demo_bc_decay_epochs: 1000  # [test3] 2000→1000: 더 빨리 소멸
    real_demo_bc_weight_init: 0.1   # [test3] 0.5→0.1: entropy 붕괴 주범 약화
    real_demo_bc_weight_final: 0.01 # [test3] 0.05→0.01
    real_demo_bc_min_buffer_size: 1
    real_demo_stride: 2
    real_demo_pour_sample_ratio: 0.6
