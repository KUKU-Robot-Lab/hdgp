# 부위별 autotune 설정 — 【오른손 Tesollo 20관절】
#
# 부위마다 config를 따로 두는 이유: autotune 결과 JSON은 tune 대상이 아니었던 group까지
# config 기본값 그대로 담는다. 부위를 섞어 돌리면 어느 값이 측정된 것이고 어느 값이
# placeholder인지 구분할 수 없어진다. 부위별로 돌리고 calibration_parts.py로
# 실제 튜닝한 group만 뽑아 자산 옆에 저장한다.
#
# 같은 자산의 다른 부위: tesollo_sensor_right_arm.yaml / tesollo_sensor_left_arm.yaml
# group 이름·regex는 네 config가 모두 같아야 한다 (tests/test_calibration_parts.py가 대조).
#
# 결과 저장 위치:
#   assets/robot/openarm_tesollo_sensor_rl/calibration/right_hand.json

asset: openarm_tesollo_sensor_rl
usd_path: assets/robot/openarm_tesollo_sensor_rl/openarm_tesollo_sensor_rl.usd
manifest: assets/robot/openarm_tesollo_sensor_rl/openarm_tesollo_sensor_rl_manifest.yaml

groups:
  head_camera:
    joint_names_expr: ["head_j_(pan|tilt)"]
    defaults: {stiffness: 400.0, damping: 80.0}

  # 팔 세 group의 기본값 = 07.29 실측 확정본(assets/.../calibration/right_arm.json).
  # 손을 여진하는 동안 팔은 실물과 같은 강성으로 버텨야 손 응답만 남는다.
  # 팔을 400/80(학습 기본값)으로 두면 팔이 실물보다 40배 뻣뻣해 손 오차에 섞인다.
  right_arm_proximal:
    joint_names_expr: ["r_aj_[1-3]"]
    defaults: {stiffness: 67.587, damping: 6.376, joint_friction: 0.213}

  right_arm_elbow:
    joint_names_expr: ["r_aj_4"]
    defaults: {stiffness: 66.979, damping: 5.635, joint_friction: 0.493}

  right_arm_wrist:
    joint_names_expr: ["r_aj_[5-7]"]
    defaults: {stiffness: 12.019, damping: 2.154, joint_friction: 0.151}

  left_arm_proximal:
    joint_names_expr: ["l_aj_[1-3]"]
    defaults: {stiffness: 400.0, damping: 80.0}

  left_arm_elbow:
    joint_names_expr: ["l_aj_4"]
    defaults: {stiffness: 400.0, damping: 80.0}

  left_arm_wrist:
    joint_names_expr: ["l_aj_[5-7]"]
    defaults: {stiffness: 400.0, damping: 80.0}

  # ── 여기부터 이 config의 튜닝 대상 ──────────────────────────────────────────
  #
  # ⚠ seed는 측정값이 아니라 학습 env(right/grasp_v1)의 sim 값이다. 실물 Tesollo의
  #   실제 임피던스는 아직 모른다. 그래서 탐색 범위를 한쪽으로 좁히지 않고
  #   40~900을 덮도록 넓게 열어 둔다 — 실물이 sim보다 훨씬 무를 가능성을 배제하지 않는다.
  #   손 계단 실측(robotctl pose torque)을 하면 그 kp를 seed로 넣고 범위를 ±10%로 좁힐 것.
  #   근거: 팔에서 kp 자유 탐색은 과적합이었고, 실측 kp 고정이 오차가 더 낮았다(07.29).
  tesollo_hand_abduction:
    joint_names_expr: ["r_hj_(thumb|index|middle|ring|pinky)_1"]
    defaults: {stiffness: 600.0, damping: 40.0}
    search:
      stiffness_scale: [0.07, 1.5]
      damping_scale: [0.1, 2.5]
      friction_scale: [0.5, 2.0]

  # curl이 task action과 가장 직접 연결되고 손 응답 차이를 가장 크게 만든다.
  tesollo_hand_curl:
    joint_names_expr: ["r_hj_(thumb|index|middle|ring|pinky)_2"]
    defaults: {stiffness: 400.0, damping: 60.0}
    search:
      stiffness_scale: [0.1, 2.25]
      damping_scale: [0.1, 2.5]
      friction_scale: [0.5, 2.0]

  tesollo_hand_pip:
    joint_names_expr: ["r_hj_(thumb|index|middle|ring|pinky)_3"]
    defaults: {stiffness: 400.0, damping: 60.0}
    search:
      stiffness_scale: [0.1, 2.25]
      damping_scale: [0.1, 2.5]
      friction_scale: [0.5, 2.0]

  tesollo_hand_dip:
    joint_names_expr: ["r_hj_(thumb|index|middle|ring|pinky)_4"]
    defaults: {stiffness: 400.0, damping: 60.0}
    search:
      stiffness_scale: [0.1, 2.25]
      damping_scale: [0.1, 2.5]
      friction_scale: [0.5, 2.0]
  # ───────────────────────────────────────────────────────────────────────────

  # gripper_2는 mimic이라 control_joint_order에는 없지만 movable이므로 group이 덮어야 한다.
  openarm_left_gripper:
    joint_names_expr: ["l_hj_gripper_[12]"]
    defaults: {stiffness: 400.0, damping: 80.0}

tune_groups:
  - tesollo_hand_abduction
  - tesollo_hand_curl
  - tesollo_hand_pip
  - tesollo_hand_dip

population_size: 128
random_seed: 7

# ⚠ 손을 여진한 트랙이어야 한다. 07.29 right_track.hdf5는 팔만 여진했으므로 여기 쓰면
#   손 group에 정보가 없어 노이즈를 맞추게 된다 (실행하면 error spread 경고가 뜬다).
#   손 트랙 수집: robotctl r2s collect 로 손 관절을 여진 → r2s normalize.
real_track:
  hdf5: /home/user/r2s/right_hand_track.hdf5
  demo_key: demo_0
  command_dataset: command/position
  measured_dataset: measured/position
  velocity_dataset: null
  dt: 0.01

error_weights:
  q: 1.0
  dq: 0.05
  delay: 0.01
