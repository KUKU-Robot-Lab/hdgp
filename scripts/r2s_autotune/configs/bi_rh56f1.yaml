# RH56F1 양팔 asset autotune 설정.
#
# groups / joint_names_expr / defaults 는 아래 env_cfg의 actuator 블록을 그대로 옮긴 것이다.
#   source/openarm/openarm/rh56f1/right/grasp_v1/grasp_right_env_cfg.py
# 값이 어긋나면 calibration이 조용히 무시되므로 tests/test_config_matches_env_cfg.py가 대조한다.

asset: openarm_bi_rh56f1_rl
usd_path: assets/robot/openarm_bi_rh56f1_rl/openarm_bi_rh56f1_rl.usd
manifest: assets/robot/openarm_bi_rh56f1_rl/openarm_bi_rh56f1_rl_manifest.yaml

groups:
  openarm_right_arm:
    joint_names_expr: ["r_aj_[1-7]"]
    defaults: {stiffness: 400.0, damping: 80.0}
    search:
      stiffness_scale: [0.8, 1.25]
      damping_scale: [0.7, 1.5]
      friction_scale: [0.7, 1.3]

  openarm_left_arm:
    joint_names_expr: ["l_aj_[1-7]"]
    defaults: {stiffness: 400.0, damping: 80.0}

  # 굴곡 5 (thumb_2 + 4손가락_1)
  rh56f1_right_flexion:
    joint_names_expr: ["r_hj_(thumb_2|index_1|middle_1|ring_1|pinky_1)"]
    defaults: {stiffness: 400.0, damping: 60.0}
    search:
      stiffness_scale: [0.7, 1.5]
      damping_scale: [0.6, 1.8]
      friction_scale: [0.5, 2.0]

  # abduction(thumb_1) — 굴곡보다 낮게(반력 교란 회피)
  rh56f1_right_abduction:
    joint_names_expr: ["r_hj_thumb_1"]
    defaults: {stiffness: 200.0, damping: 35.0}
    search:
      stiffness_scale: [0.7, 1.5]
      damping_scale: [0.6, 1.8]
      friction_scale: [0.5, 2.0]

  # mimic(원위) 6 — underactuated. drive를 따라가야 하므로 좁게 탐색한다.
  rh56f1_right_mimic:
    joint_names_expr: ["r_hj_(thumb_[34]|index_2|middle_2|ring_2|pinky_2)"]
    defaults: {stiffness: 400.0, damping: 60.0}
    search:
      stiffness_scale: [0.8, 1.3]
      damping_scale: [0.8, 1.5]
      friction_scale: [0.7, 1.5]

  rh56f1_left_drive:
    joint_names_expr: ["l_hj_(thumb_[12]|index_1|middle_1|ring_1|pinky_1)"]
    defaults: {stiffness: 30.0, damping: 5.0}

  rh56f1_left_mimic:
    joint_names_expr: ["l_hj_(thumb_[34]|index_2|middle_2|ring_2|pinky_2)"]
    defaults: {stiffness: 0.0, damping: 0.0}

# phase 1: 오른손 자유공간 tracking부터. 왼팔/왼손은 학습에 안 쓰이므로 뒤로 미룬다.
tune_groups:
  - openarm_right_arm
  - rh56f1_right_flexion
  - rh56f1_right_abduction

population_size: 128
random_seed: 7

# real_track: 실물 identification HDF5가 생기면 채운다.
# 그 전에는 make_synthetic_track.py 산출물을 가리켜 파이프라인을 검증한다.
real_track:
  hdf5: logs/r2s_autotune/seeds/bi_rh56f1_synthetic.hdf5
  demo_key: demo_0
  command_dataset: obs/q_cmd
  measured_dataset: obs/q_real
  velocity_dataset: obs/dq_real
  dt: 0.01

error_weights:
  q: 1.0
  dq: 0.05
  delay: 0.01
